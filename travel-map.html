<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅の記録マップ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />

    <!-- サイト共通のデザイン（コルクボード＋紙）。順番は必ず reset → common -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/common.css">

    <style>
        /* リセットと共通の色・フォントは reset.css / common.css を使う。
           ここでは地図アプリ特有のレイアウトだけを定義する。 */

        /* コルクボードの上を普通に縦スクロールするページ（他ページと同じ作法）。
           body の背景=コルク・フォントは common.css がすでに指定している。 */

        /* ─ 概要バッジ・モード切替を載せる操作用の紙 */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-sm);
        }
        .toolbar__count {
            font-family: var(--font-serif);
            font-size: var(--font-base);
        }

        /* ─ 概要の数字カード */
        .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-xs); margin-top: var(--space-sm); }
        .stat-card { background: var(--paper-note); border: 1px solid var(--paper-edge); border-radius: 8px; padding: 12px; text-align: center; }
        .stat-n { font-family: var(--font-serif); font-size: var(--font-2xl); font-weight: 700; color: var(--blue-dark); line-height: 1.2; }
        .stat-l { font-size: var(--font-xs); color: var(--text-sub); margin-top: 2px; }

        /* ─ 検索 */
        .search-input {
            width: 100%;
            margin-top: var(--space-sm);
            padding: 8px 10px;
            border: 1px solid var(--paper-edge);
            border-radius: 6px;
            font-size: var(--font-sm);
            outline: none;
        }
        .search-input:focus { border-color: var(--blue); }

        /* ─ 地図：机に貼った一枚の地図のように、紙のフチをつけて枠に収める */
        #map {
            height: min(64vh, 520px);
            background: #dfe6ec;
            border: 6px solid var(--paper);
            box-shadow: inset 0 0 0 1px var(--paper-edge);
            border-radius: 2px;
        }

        /* ─ 訪問地リスト（スタンプ風の日付バッジ付き）。紙の中で縦に長ければスクロール */
        .place-scroll {
            max-height: 420px;
            overflow-y: auto;
            margin-top: var(--space-xs);
        }
        .place-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 4px;
            border-bottom: 1px dashed var(--paper-edge);
            cursor: pointer;
            transition: background 0.12s;
        }
        .place-item:hover { background: var(--paper-note); }
        .place-item.active { background: #e9f1fa; }

        .place-stamp {
            flex-shrink: 0;
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 2px dashed var(--red-dark);
            color: var(--red-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 700;
            line-height: 1.15;
        }
        .place-info { min-width: 0; }
        .place-name {
            font-size: var(--font-sm);
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .place-area { font-size: 11px; color: var(--text-sub); }

        .empty-list { text-align: center; color: var(--text-sub); font-size: var(--font-xs); padding: 30px 16px; }

        /* ─ スマホ：地図を先に、リストの紙を後に表示する */
        .map-layout { display: flex; flex-direction: column; gap: var(--space-sm); }
        #map-paper { order: -1; }

        /* ─ タブレット以上：地図とサイドの紙を横並びにする（リストが左） */
        @media (min-width: 900px) {
            .map-layout {
                display: grid;
                grid-template-columns: 300px 1fr;
                gap: var(--space-md);
                align-items: start;
            }
            #map-paper { order: 0; }
            #map { height: min(72vh, 640px); }
            .place-scroll { max-height: 52vh; }
        }

        /* ─ スタンプ風マーカー（地図上）：紙色の地に破線の丸 */
        .stamp-marker {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: var(--paper);
            border: 2px dashed var(--red-dark);
            box-shadow: var(--paper-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--red-dark);
            font-weight: 700;
            font-size: 10px;
            line-height: 1.1;
        }

        /* ─ ポップアップ（訪問地の詳細） */
        .pu { min-width: 240px; max-width: 300px; }
        .pu-name { font-family: var(--font-serif); font-size: var(--font-base); font-weight: 700; color: var(--blue-dark); margin-bottom: 2px; }
        .pu-meta { font-size: 11px; color: var(--text-sub); margin-bottom: 8px; }
        .pu-memo { font-size: var(--font-xs); color: var(--text); line-height: 1.6; margin-bottom: 8px; white-space: pre-wrap; }
        /* 写真がメインなので大きく見せる。写真は縦に並べて幅いっぱいに */
        .pu-photos { display: grid; grid-template-columns: 1fr; gap: 8px; }
        /* 写真が複数あるときは2列にして詰め込む */
        .pu-photos.multi { grid-template-columns: 1fr 1fr; }
        .pu-photos img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 8px;
            cursor: zoom-in;
            border: 1px solid var(--paper-edge);
        }

        /* ─ 写真ライトボックス */
        .lightbox {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.82);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9000;
            cursor: zoom-out;
        }
        .lightbox.show { display: flex; }
        .lightbox img {
            max-width: 88vw;
            max-height: 88vh;
            border-radius: 6px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<!-- ── ヘッダー（サイト共通：ロゴと戻るリンク） ── -->
<header class="site-header">
    <div class="container site-header__inner">
        <a class="site-header__logo" href="index.html">やち堂</a>
        <a class="site-header__back" href="index.html">← トップへ戻る</a>
    </div>
</header>


<main>

    <!-- ── タイトル ── -->
    <section class="section container">
        <div class="paper paper--tape tilt-l1">
            <h1 class="heading">
                旅の記録マップ
                <span class="heading__en">TRAVEL MAP</span>
            </h1>
        </div>
    </section>


    <!-- ── 地図と訪問地リスト ── -->
    <section class="section container">
        <div class="map-layout">

            <!-- 左：概要・検索・訪問地リストの紙 -->
            <div class="paper paper--pin paper--pin-blue tilt-r1">
                <h2 class="subheading">訪ねたところ</h2>

                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-n" id="stat-total">0</div>
                        <div class="stat-l">訪問地</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-n" id="stat-area">0</div>
                        <div class="stat-l">エリア数</div>
                    </div>
                </div>

                <input class="search-input" id="search" type="text"
                       placeholder="地名・エリア・メモで検索..."
                       oninput="onSearch()">

                <div class="place-scroll" id="place-list"></div>
            </div>

            <!-- 右：地図を貼った紙（地図は傾けると操作できなくなるので水平のまま） -->
            <div class="paper" id="map-paper">
                <div id="map"></div>
            </div>

        </div>
    </section>

</main>


<footer class="site-footer">
    <div class="container">
        <p>&copy; 2026 やち堂</p>
    </div>
</footer>


<!-- 写真ライトボックス -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="">
</div>

<!-- ━━━ ライブラリ ━━━ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script>
'use strict';

// ============================================================
//  設定
// ============================================================
// 訪問地データのJSONファイル（同じ階層に置く想定）
const DATA_URL = 'travel-data.json';

// ============================================================
//  グローバル状態
// ============================================================
let places      = [];   // travel-data.json の中身
let map         = null;
let markerGroup = null;
let activeId    = null; // サイドバーで選択中の訪問地id

// ============================================================
//  データ読み込み
// ============================================================
async function loadPlaces() {
    try {
        const res = await fetch(DATA_URL);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        places = await res.json();
    } catch (e) {
        console.error('travel-data.json の読み込みに失敗しました:', e);
        // file:// で直接開くとブラウザのセキュリティ制限でfetchが失敗することがあるため、
        // その場合は簡易ローカルサーバーで開くよう案内する
        document.getElementById('place-list').innerHTML =
            '<div class="empty-list">データを読み込めませんでした。<br>' +
            'travel-data.json が同じフォルダにあるか確認してください。<br>' +
            '（ブラウザで直接HTMLファイルを開いている場合は、簡易サーバー経由で開く必要があります）</div>';
        return;
    }

    initMap();
    renderAll();
}

// ============================================================
//  地図の初期化
// ============================================================
function initMap() {
    map = L.map('map', {
        center: [35.5, 137],
        zoom: 5,
        minZoom: 2,
    });

    // CARTOの淡色タイル（世界中カバーできるので海外の訪問地も表示できる）
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 19,
    }).addTo(map);

    markerGroup = L.layerGroup().addTo(map);
}

// ============================================================
//  全体描画
// ============================================================
function renderAll() {
    const list = getFilteredPlaces();

    document.getElementById('stat-total').textContent    = places.length;
    document.getElementById('stat-area').textContent     = countUniqueAreas(places);

    renderSidebarList(list);
    renderMarkers(list);
}

function countUniqueAreas(list) {
    const set = new Set(list.filter(p => p.area).map(p => p.area));
    return set.size;
}

// ============================================================
//  検索・絞り込み
// ============================================================
function onSearch() {
    renderAll();
}

function getFilteredPlaces() {
    const q = document.getElementById('search').value.toLowerCase().trim();
    // 日付の新しい順に並べる（YYYY-MM / YYYY-MM-DD どちらの形式でも文字列比較で概ね正しく並ぶ）
    const sorted = [...places].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    if (!q) return sorted;

    return sorted.filter(p =>
        (p.name || '').toLowerCase().includes(q) ||
        (p.area || '').toLowerCase().includes(q)  ||
        (p.memo || '').toLowerCase().includes(q)
    );
}

// ============================================================
//  サイドバーの訪問地リスト
// ============================================================
function renderSidebarList(list) {
    const el = document.getElementById('place-list');

    if (list.length === 0) {
        el.innerHTML = '<div class="empty-list">該当する訪問地がありません</div>';
        return;
    }

    el.innerHTML = list.map(p => `
        <div class="place-item ${p.id === activeId ? 'active' : ''}" onclick="focusPlace(${p.id})">
            <div class="place-stamp">${stampLabel(p.date)}</div>
            <div class="place-info">
                <div class="place-name">${escHtml(p.name)}</div>
                <div class="place-area">${escHtml(p.area || '')}</div>
            </div>
        </div>
    `).join('');
}

// リストの項目をクリックしたら地図をその場所へ移動し、ポップアップを開く
function focusPlace(id) {
    const p = places.find(x => x.id === id);
    if (!p) return;

    activeId = id;
    renderSidebarList(getFilteredPlaces());

    map.flyTo([p.lat, p.lng], 12, { duration: 0.6 });

    const marker = markersById[id];
    if (marker) setTimeout(() => marker.openPopup(), 350);
}

// ============================================================
//  日付表示のフォーマット
// ============================================================
// "2024-08" のように月までしかない場合と、"2024-08-12" のように日まである場合の両方に対応する
function formatDate(dateStr) {
    if (!dateStr) return '日付不明';
    const parts = dateStr.split('-');
    const year  = parts[0];
    const month = parts[1] ? parseInt(parts[1], 10) : null;
    const day   = parts[2] ? parseInt(parts[2], 10) : null;

    if (month === null) return `${year}年`;
    if (day   === null) return `${year}年${month}月`;
    return `${year}年${month}月${day}日`;
}

// スタンプバッジ内に表示する短い日付ラベル（例: "'24 / 8"）
function stampLabel(dateStr) {
    if (!dateStr) return '不明';
    const parts = dateStr.split('-');
    const yearShort = parts[0] ? parts[0].slice(2) : '??';
    const month = parts[1] ? parseInt(parts[1], 10) : null;
    return month ? `'${yearShort}<br>${month}月` : `'${yearShort}`;
}

// ============================================================
//  マーカー描画
// ============================================================
let markersById = {}; // id -> Leafletマーカー（サイドバーからの参照移動用）

function renderMarkers(list) {
    markerGroup.clearLayers();
    markersById = {};

    list.forEach(p => {
        const marker = L.marker([p.lat, p.lng], { icon: makeStampIcon(p) });
        marker.bindPopup(buildPopupHtml(p), { maxWidth: 320 });
        marker.on('popupopen', () => bindLightboxHandlers(p));

        markerGroup.addLayer(marker);
        markersById[p.id] = marker;
    });
}

// スタンプ風の丸いdivIconを作る
function makeStampIcon(p) {
    const label = stampLabel(p.date);
    return L.divIcon({
        html: `<div class="stamp-marker">${label}</div>`,
        iconSize: [44, 44],
        iconAnchor: [22, 22],
        popupAnchor: [0, -22],
        className: '',
    });
}

function buildPopupHtml(p) {
    const photosHtml = (p.photos && p.photos.length > 0)
        ? `<div class="pu-photos ${p.photos.length > 1 ? 'multi' : ''}">` +
            p.photos.map(src => `<img src="${escHtml(src)}" data-full="${escHtml(src)}" onerror="this.style.display='none'">`).join('') +
          `</div>`
        : '';

    return `
        <div class="pu">
            <div class="pu-name">${escHtml(p.name)}</div>
            <div class="pu-meta">${escHtml(p.area || '')}　${formatDate(p.date)}</div>
            ${p.memo ? `<div class="pu-memo">${escHtml(p.memo)}</div>` : ''}
            ${photosHtml}
        </div>
    `;
}

// ポップアップ内の写真をクリックしたらライトボックスで拡大表示する
function bindLightboxHandlers(p) {
    document.querySelectorAll('.pu-photos img').forEach(img => {
        img.onclick = (e) => {
            e.stopPropagation();
            openLightbox(img.dataset.full);
        };
    });
}

// ============================================================
//  写真ライトボックス
// ============================================================
function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('show');
}
function closeLightbox() {
    document.getElementById('lightbox').classList.remove('show');
}

// ============================================================
//  ユーティリティ
// ============================================================
function escHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

// ページ読み込み時にデータをフェッチして地図を作る
loadPlaces();
</script>
</body>
</html>
